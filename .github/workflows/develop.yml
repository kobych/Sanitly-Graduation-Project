name: Static analysis and build
on:
  push:
    branches: [ develop ]
jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlintCheck
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck

      - name: detekt
        run: |
          chmod +x gradlew
          ./gradlew detekt

      - name: lintDebug
        run: |
          chmod +x gradlew
          ./gradlew lintDebug

  assembleDebug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug